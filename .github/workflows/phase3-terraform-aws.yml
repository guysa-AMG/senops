name: phase3-terraform-aws

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/phase3-terraform-aws.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  tf-checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov IaC scan
        run: checkov -d infra/terraform --framework terraform --output cli

  terraform:
    needs: tf-checkov
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_VAR_region: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Fetch runtime secrets from AWS Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id app/runtime \
            --query SecretString \
            --output text
