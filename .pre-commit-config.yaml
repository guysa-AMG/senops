repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.82.0
    hooks:
      - id: trufflehog
        name: trufflehog
        entry: bash -c 'trufflehog filesystem --no-update --fail .' 
        language: system
        pass_filenames: false
  - repo: https://github.com/semgrep/semgrep
    rev: v1.92.0
    hooks:
      - id: semgrep
        args: ["--config", "auto", "--error", "--severity", "ERROR"]
  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy fs scan
        entry: bash -c 'trivy fs --security-checks vuln,config --severity CRITICAL,HIGH --exit-code 1 .' 
        language: system
        pass_filenames: false
